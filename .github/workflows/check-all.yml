name: Check all

on:
  - push
  - pull_request

jobs:
  check-all:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git bc bison flex libssl-dev \
            libncurses5-dev libncursesw5-dev dwarves device-tree-compiler \
            gcc-aarch64-linux-gnu

      - name: Setup Raspberry Pi 4 kernel headers
        run: |
          KERNEL_DIR="$HOME/rpi4-linux"
          git clone -b rpi-6.6.y --depth=1 https://github.com/raspberrypi/linux "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bcm2711_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare scripts
          echo "RPI4_KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV

      - name: Setup Raspberry Pi 5 kernel headers
        run: |
          KERNEL_DIR="$HOME/rpi5-linux"
          git clone -b rpi-6.6.y --depth=1 https://github.com/raspberrypi/linux "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bcm2712_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare scripts
          echo "RPI5_KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV

      - name: Check all
        uses: tsnlab/check@main
        with:
          python_version: '3.12'
          rust_version: 'stable'
          github_token: ${{ secrets.GITHUB_TOKEN }}
